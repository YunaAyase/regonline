version: '3.8'
services:
  backend:
    build: ./backend
    ports: ["5001:5001"]
    volumes:
      - ./backend/data:/app/data
      - ./photos:/app/photos
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["5000:5000"]
    environment:
      - NUXT_PUBLIC_API_BASE=http://backend:5001/api
      - TZ=Asia/Shanghai
    depends_on: [backend]
    restart: unless-stopped
